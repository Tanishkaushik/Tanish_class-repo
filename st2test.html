<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A2Z Shop</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
        }

        .container {
            width: 90%;
            margin: auto;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .card {
            background-color: white;
            width: 23%;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .card h3 {
            margin: 15px 0 5px;
            font-size: 16px;
        }

        .card p {
            margin: 5px 0;
            font-size: 14px;
            color: gray;
        }

        .price {
            font-weight: bold;
            color: black;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>A2Z Shop</h1>

    <div class="container">
        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Google Pixel 9">
            <h3>Google Pixel 9</h3>
            <p>Premium design with powerful performance</p>
            <p class="price">Rs. 89,999</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Lenovo IdeaPad 5">
            <h3>Lenovo IdeaPad 5</h3>
            <p>Intel Core i5 Processor 8GB</p>
            <p class="price">Rs. 74,999</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Philips Airfryer">
            <h3>Philips Airfryer</h3>
            <p>Philips 6.2 Litre Air Fryer</p>
            <p class="price">Rs. 6,999</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/200" alt="Dolby Atmos Soundbar">
            <h3>Dolby Atmos Soundbar</h3>
            <p>Juke bar 9775 Dolby Atmos</p>
            <p class="price">Rs. 9,999</p>
        </div>
    </div>

</body>
</html>
